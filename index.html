<style>
  :root { --bg: #1a1a26; --panel: #22222f; --text: #e2e0f0; --muted: #77748f; --accent: #a78bfa; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Pretendard', 'Malgun Gothic', sans-serif; overflow: hidden; }
  #graph { width: 100vw; height: 100vh; cursor: grab; }
  header { position: fixed; top: 20px; left: 24px; z-index: 10; pointer-events: none; }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  header p { font-size: 12px; color: var(--muted); margin-top: 4px; }
  #legend { position: fixed; bottom: 20px; left: 24px; z-index: 10; background: rgba(34,34,47,.85);
            border: 1px solid #34344a; border-radius: 10px; padding: 12px 14px; font-size: 12px; }
  #legend div { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  #legend span.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #hint { position: fixed; bottom: 20px; right: 24px; z-index: 10; color: var(--muted); font-size: 11px; }
  .node-label { fill: var(--text); pointer-events: none; font-size: 11px; text-shadow: 0 1px 4px #000; }
  #lock { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex;
          flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  #lock h2 { font-size: 18px; font-weight: 700; }
  #lock p { font-size: 13px; color: var(--muted); }
  #pw { background: var(--panel); border: 1px solid #34344a; border-radius: 8px; color: var(--text);
        padding: 10px 14px; font-size: 14px; width: 240px; text-align: center; outline: none; }
  #pw:focus { border-color: var(--accent); }
  #unlock-btn { background: var(--accent); border: none; border-radius: 8px; color: #16121f;
                font-weight: 700; padding: 10px 28px; font-size: 14px; cursor: pointer; }
  #pw-err { color: #f38ba8; font-size: 12px; min-height: 16px; }
  #panel { position: fixed; top: 0; right: 0; height: 100vh; width: 420px; max-width: 92vw; z-index: 50;
           background: rgba(34,34,47,.97); border-left: 1px solid #34344a; padding: 24px;
           overflow-y: auto; transform: translateX(105%); transition: transform .25s ease; }
  #panel.open { transform: translateX(0); }
  #panel .close { position: absolute; top: 14px; right: 16px; background: none; border: none;
                  color: var(--muted); font-size: 20px; cursor: pointer; }
  #panel .badge { display: inline-block; font-size: 11px; padding: 2px 10px; border-radius: 99px;
                  background: #34344a; color: var(--text); margin-bottom: 10px; }
  #panel h1.title { font-size: 20px; margin-bottom: 14px; }
  #md { font-size: 13.5px; line-height: 1.75; }
  #md h1 { display: none; }
  #md h2 { font-size: 15px; margin: 18px 0 8px; color: #c4b5fd; }
  #md h3 { font-size: 13.5px; margin: 14px 0 6px; }
  #md p, #md li { margin-bottom: 6px; }
  #md ul, #md ol { padding-left: 18px; }
  #md table { border-collapse: collapse; margin: 10px 0; font-size: 12.5px; }
  #md th, #md td { border: 1px solid #34344a; padding: 5px 9px; }
  #md a { color: var(--accent); }
  #md .wl { color: var(--accent); cursor: pointer; text-decoration: underline dotted; }
  #md hr { border: none; border-top: 1px solid #34344a; margin: 14px 0; }
  #md blockquote { border-left: 3px solid var(--accent); padding-left: 10px; color: var(--muted); }
  #md code { background: #2a2a3a; border-radius: 4px; padding: 1px 5px; font-size: 12px; }
</style>

      { name: 'PBKDF2', salt: b64d(PAYLOAD.salt), iterations: 100000, hash: 'SHA-256' },
      km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(PAYLOAD.iv) }, key, b64d(PAYLOAD.ct));
    DATA = JSON.parse(new TextDecoder().decode(pt));
    document.getElementById('lock').remove();
    init(DATA);
  } catch (e) {
    document.getElementById('pw-err').textContent = '비밀번호가 맞지 않아요';
  }
}
document.getElementById('unlock-btn').onclick = tryUnlock;
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });

function openPanel(id) {
  const md = DATA.contents[id] || '';
  const pre = md.replace(/\[\[([^\]|#]+)(?:[#|][^\]]*)?\]\]/g, (m, t) =>
    DATA.contents[t.trim()] !== undefined
      ? `<span class="wl" data-t="${t.trim()}">${t.trim()}</span>` : t.trim());
  document.getElementById('p-group').textContent = (DATA.nodes.find(n => n.id === id) || {}).group || '';
  document.getElementById('p-title').textContent = id;
  document.getElementById('md').innerHTML = marked.parse(pre);
  document.querySelectorAll('#md .wl').forEach(el => el.onclick = () => openPanel(el.dataset.t));
  panel.classList.add('open');
  panel.scrollTop = 0;
}

function init(data) {
  const W = innerWidth, H = innerHeight;
  const svg = d3.select('#graph').append('svg').attr('width', W).attr('height', H);
  const g = svg.append('g');
  svg.call(d3.zoom().scaleExtent([0.2, 4]).on('zoom', e => g.attr('transform', e.transform)));
  svg.on('click', () => panel.classList.remove('open'));

  const sim = d3.forceSimulation(data.nodes)
    .force('link', d3.forceLink(data.links).id(d => d.id).distance(90).strength(0.6))
    .force('charge', d3.forceManyBody().strength(-260))
    .force('center', d3.forceCenter(W / 2, H / 2))
    .force('collide', d3.forceCollide().radius(d => 14 + d.deg * 1.5));

  const link = g.append('g').selectAll('line').data(data.links).join('line')
    .attr('stroke', '#3a3a52').attr('stroke-width', 1).attr('stroke-opacity', 0.55);

  const node = g.append('g').selectAll('circle').data(data.nodes).join('circle')
    .attr('r', d => 5 + Math.sqrt(d.deg) * 3)
    .attr('fill', d => COLORS[d.group] || '#9b96c4')
    .style('filter', 'drop-shadow(0 0 8px rgba(167,139,250,.45))')
    .style('cursor', 'pointer')
    .call(d3.drag()
      .on('start', (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on('end', (e, d) => { if (!e.active) sim.alphaTarget(0); }));

  node.on('click', (e, d) => { e.stopPropagation(); openPanel(d.id); });

  const label = g.append('g').selectAll('text').data(data.nodes).join('text')
    .attr('class', 'node-label').attr('text-anchor', 'middle')
    .attr('dy', d => -(10 + Math.sqrt(d.deg) * 3))
    .text(d => d.id);

  const neighbors = new Set(data.links.flatMap(l =>
    [(l.source.id || l.source) + '|' + (l.target.id || l.target),
     (l.target.id || l.target) + '|' + (l.source.id || l.source)]));

  node.on('mouseover', (e, d) => {
      node.attr('opacity', n => n.id === d.id || neighbors.has(d.id + '|' + n.id) ? 1 : 0.12)
          .attr('fill', n => n.id === d.id ? '#c4b5fd' : (neighbors.has(d.id + '|' + n.id) ? '#b5a8f0' : COLORS[n.group]));
      label.attr('opacity', n => n.id === d.id || neighbors.has(d.id + '|' + n.id) ? 1 : 0.08);
      link.attr('stroke-opacity', l => l.source.id === d.id || l.target.id === d.id ? 0.95 : 0.05)
          .attr('stroke', l => l.source.id === d.id || l.target.id === d.id ? '#a78bfa' : '#3a3a52')
          .attr('stroke-width', l => l.source.id === d.id || l.target.id === d.id ? 1.6 : 1);
    })
    .on('mouseout', () => {
      node.attr('opacity', 1).attr('fill', n => COLORS[n.group] || '#9b96c4');
      label.attr('opacity', 1);
      link.attr('stroke-opacity', 0.55).attr('stroke', '#3a3a52').attr('stroke-width', 1);
    });

  sim.on('tick', () => {
    link.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    node.attr('cx', d => d.x).attr('cy', d => d.y);
    label.attr('x', d => d.x).attr('y', d => d.y);
  });

  const legend = d3.select('#legend');
  Object.entries(COLORS).forEach(([k, c]) => {
    legend.append('div').html(`<span class="dot" style="background:${c}"></span>${k}`);
  });
}
</script>
</body>
